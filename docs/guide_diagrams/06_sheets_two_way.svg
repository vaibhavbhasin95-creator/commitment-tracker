<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C53030"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker></defs><rect width="1600" height="940" fill="#FFFFFF"/><rect x="10" y="10" width="1580" height="470" rx="14" fill="#E9F7EF" fill-opacity="0.55" stroke="#2F855A" stroke-width="2" stroke-dasharray="9 6"/><text x="24" y="35" font-size="19" font-weight="bold" fill="#2F855A" text-anchor="start">Outbound — App → Google Sheet</text><rect x="30" y="60" width="300" height="166" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/><text x="44" y="90.0" font-size="20" font-weight="bold" fill="#2B6CB0" text-anchor="start">Triggers</text><text x="44" y="116.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">upload / capture / add task →</text><text x="44" y="138.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">auto_sync_to_sheet (needs</text><text x="44" y="160.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">auto_sync on)</text><text x="44" y="182.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">&#x27;Sync all&#x27; → sync_all_to_tracker</text><text x="44" y="204.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">&#x27;Sync&#x27; on a task → sync_tracker</text><rect x="380" y="60" width="270" height="144" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="515.0" y="90.0" font-size="20" font-weight="bold" fill="#4A5568" text-anchor="middle">BEGIN IMMEDIATE</text><text x="515.0" y="116.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">take the SQLite write lock</text><text x="515.0" y="138.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">first, so two requests can&#x27;t</text><text x="515.0" y="160.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">both write the same rows (the</text><text x="515.0" y="182.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">old double-sync bug)</text><rect x="700" y="60" width="300" height="122" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="850.0" y="90.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">Pick rows to send</text><text x="850.0" y="116.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">get_sheets_tracker_config()</text><text x="850.0" y="138.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">commitments WHERE external_ref</text><text x="850.0" y="160.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">IS NULL</text><rect x="1050" y="60" width="520" height="188" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="1310.0" y="90.0" font-size="20" font-weight="bold" fill="#2C7A7B" text-anchor="middle">google_sheets.append_commitment_rows</text><text x="1310.0" y="116.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">values.get A:A → next empty row n (header row first if the</text><text x="1310.0" y="138.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">sheet is empty)</text><text x="1310.0" y="160.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">values.update A{n}:E{m}  [ID, Task, Owner, Due date,</text><text x="1310.0" y="182.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Status]</text><text x="1310.0" y="204.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">explicit range, not values.append — append shifted rows</text><text x="1310.0" y="226.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">right when a due date was blank</text><path d="M330,123.0 L380,112.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M650,132.0 L700,121.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M1000,121.0 L1050,154.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1050" y="270" width="520" height="100" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="1310.0" y="300.0" font-size="20" font-weight="bold" fill="#4A5568" text-anchor="middle">Save the link</text><text x="1310.0" y="326.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">UPDATE commitments SET external_ref = &#x27;row-n&#x27;</text><text x="1310.0" y="348.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">tracker_sync_log (outbound, synced) · COMMIT</text><path d="M1310.0,248 L1310.0,270" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1256.36" y="237.0" width="107.28" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="1310" y="256.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">row numbers</text><rect x="30" y="300" width="620" height="100" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/><text x="44" y="330.0" font-size="20" font-weight="bold" fill="#2B6CB0" text-anchor="start">Status changed in the app (PATCH /api/commitments/&lt;id&gt;)</text><text x="44" y="356.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">auto_push_status_to_sheet → update_status(): writes only cell E{n}.</text><text x="44" y="378.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">An API write doesn&#x27;t fire the sheet&#x27;s On edit trigger, so no echo loop.</text><path d="M650,350.0 L1000,350.0 L1000,220 L1050,220" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="767.88" y="337.0" width="124.24000000000001" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="830" y="356.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">E{n} = &#x27;Done&#x27;</text><rect x="10" y="500" width="1580" height="430" rx="14" fill="#FEF3E6" fill-opacity="0.55" stroke="#C05621" stroke-width="2" stroke-dasharray="9 6"/><text x="24" y="525" font-size="19" font-weight="bold" fill="#C05621" text-anchor="start">Inbound — Google Sheet → App</text><rect x="30" y="550" width="280" height="150" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/><text x="170.0" y="603.0" font-size="20" font-weight="bold" fill="#2B6CB0" text-anchor="middle">Person edits Status</text><text x="170.0" y="629.0" font-size="20" font-weight="bold" fill="#2B6CB0" text-anchor="middle">(column E)</text><text x="170.0" y="655.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">e.g. &#x27;Closed&#x27;</text><rect x="340" y="550" width="420" height="150" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="550.0" y="583.0" font-size="20" font-weight="bold" fill="#C05621" text-anchor="middle">Apps Script: onStatusEdit(e)</text><text x="550.0" y="609.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">installable &#x27;On edit&#x27; trigger (a simple onEdit</text><text x="550.0" y="631.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">can&#x27;t call URLs)</text><text x="550.0" y="653.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">UrlFetchApp POST {email, external_ref: &#x27;row-n&#x27;,</text><text x="550.0" y="675.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">status}</text><path d="M310,625.0 L340,625.0" fill="none" stroke="#C05621" stroke-width="2.2" marker-end="url(#aho)"/><rect x="790" y="550" width="330" height="150" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="955.0" y="605.0" font-size="20" font-weight="bold" fill="#C53030" text-anchor="middle">ngrok public URL</text><text x="955.0" y="631.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">https → localhost:5000</text><text x="955.0" y="653.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">free plan URL changes on restart!</text><path d="M760,625.0 L790,625.0" fill="none" stroke="#C05621" stroke-width="2.2" marker-end="url(#aho)"/><rect x="1150" y="550" width="420" height="150" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="1360.0" y="605.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">POST /api/webhooks/tracker-update</text><text x="1360.0" y="631.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">find commitment by owner email + external_ref</text><text x="1360.0" y="653.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">(404 if none)</text><path d="M1120,625.0 L1150,625.0" fill="none" stroke="#C05621" stroke-width="2.2" marker-end="url(#aho)"/><rect x="1150" y="740" width="420" height="100" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="1360.0" y="770.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">normalize_tracker_status</text><text x="1360.0" y="796.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Closed / Complete → done · WIP → in_progress ·</text><text x="1360.0" y="818.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">unknown → 400</text><path d="M1360.0,700 L1360.0,740" fill="none" stroke="#C05621" stroke-width="2.2" marker-end="url(#aho)"/><rect x="620" y="740" width="470" height="100" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="855.0" y="770.0" font-size="20" font-weight="bold" fill="#4A5568" text-anchor="middle">apply_inbound_tracker_update</text><text x="855.0" y="796.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">UPDATE status · tracker_sync_log (inbound, received)</text><text x="855.0" y="818.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">· COMMIT · 201</text><path d="M1150,790.0 L1090,790.0" fill="none" stroke="#C05621" stroke-width="2.2" marker-end="url(#aho)"/><rect x="30" y="740" width="540" height="122" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="300.0" y="770.0" font-size="20" font-weight="bold" fill="#C53030" text-anchor="middle">⚠ No secret on this webhook</text><text x="300.0" y="796.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Anyone with the ngrok URL who knows the account email can</text><text x="300.0" y="818.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">change a status by guessing row-n. Backlog item: add a shared</text><text x="300.0" y="840.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">token.</text></svg>