<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C53030"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect x="10" y="10" width="1580" height="300" rx="14" fill="#F3EEFC" fill-opacity="0.55" stroke="#6B46C1" stroke-width="2" stroke-dasharray="9 6"/><text x="24" y="35" font-size="19" font-weight="bold" fill="#6B46C1" text-anchor="start">A. Original training — ml/train_action_detector.py (produced the model in use today)</text><rect x="26" y="70" width="250" height="200" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="151.0" y="127.0" font-size="18" font-weight="bold" fill="#4A5568" text-anchor="middle">Labelled CSVs</text><text x="151.0" y="153.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">train_utterances_balanced.</text><text x="151.0" y="175.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">csv (44,504 rows)</text><text x="151.0" y="197.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">test_utterances_balanced.c</text><text x="151.0" y="219.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">sv</text><rect x="294" y="70" width="200" height="200" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="394.0" y="138.0" font-size="18" font-weight="bold" fill="#2C7A7B" text-anchor="middle">load()</text><text x="394.0" y="164.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">x = &#x27;speaker: text&#x27;</text><text x="394.0" y="186.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">y = 1 if label is</text><text x="394.0" y="208.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">ACTION</text><path d="M276,170.0 L294,170.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="512" y="70" width="230" height="200" rx="10" fill="#F3EEFC" stroke="#6B46C1" stroke-width="2"/><text x="627.0" y="138.0" font-size="18" font-weight="bold" fill="#6B46C1" text-anchor="middle">embed()</text><text x="627.0" y="164.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">MiniLM, batch 256</text><text x="627.0" y="186.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">cached in</text><text x="627.0" y="208.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">ml/emb_cache/*.npy</text><path d="M494,170.0 L512,170.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="760" y="70" width="200" height="200" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="860.0" y="138.0" font-size="18" font-weight="bold" fill="#2C7A7B" text-anchor="middle">Split</text><text x="860.0" y="164.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">85 % fit / 15 %</text><text x="860.0" y="186.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">validation</text><text x="860.0" y="208.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">stratified, seed 42</text><path d="M742,170.0 L760,170.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="978" y="70" width="300" height="200" rx="10" fill="#F3EEFC" stroke="#6B46C1" stroke-width="2"/><text x="1128.0" y="116.0" font-size="18" font-weight="bold" fill="#6B46C1" text-anchor="middle">Train MLP</text><text x="1128.0" y="142.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">256 relu → dropout 0.3 → 128</text><text x="1128.0" y="164.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">relu → 1 sigmoid</text><text x="1128.0" y="186.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">adam · binary cross-entropy</text><text x="1128.0" y="208.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">≤ 30 epochs, early stop patience</text><text x="1128.0" y="230.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">5</text><path d="M960,170.0 L978,170.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1296" y="70" width="240" height="200" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1416.0" y="138.0" font-size="18" font-weight="bold" fill="#276749" text-anchor="middle">Evaluate + save</text><text x="1416.0" y="164.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">report @ 0.5, ROC-AUC</text><text x="1416.0" y="186.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">→</text><text x="1416.0" y="208.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">ml/action_detector.keras</text><path d="M1278,170.0 L1296,170.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="10" y="330" width="1580" height="560" rx="14" fill="#FFFBEA" fill-opacity="0.55" stroke="#B7791F" stroke-width="2" stroke-dasharray="9 6"/><text x="24" y="355" font-size="19" font-weight="bold" fill="#B7791F" text-anchor="start">B. Retraining on the team&#x27;s transcripts (2026-10-01) — result kept as a candidate, NOT in use</text><rect x="26" y="380" width="300" height="170" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="176.0" y="433.0" font-size="18" font-weight="bold" fill="#2C7A7B" text-anchor="middle">prepare_transcript_dataset.py</text><text x="176.0" y="459.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">.docx / .txt / .vtt → lines</text><text x="176.0" y="481.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">grouped into 6 &#x27;families&#x27;</text><text x="176.0" y="503.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">→ utterances_for_labelling.csv</text><rect x="350" y="380" width="280" height="170" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="490.0" y="433.0" font-size="18" font-weight="bold" fill="#4A5568" text-anchor="middle">training_data/labels.py</text><text x="490.0" y="459.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">hand-picked ACTION lines</text><text x="490.0" y="481.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">→ labelled_utterances.csv</text><text x="490.0" y="503.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">2,996 lines · 158 ACTION</text><rect x="654" y="380" width="420" height="170" rx="10" fill="#F3EEFC" stroke="#6B46C1" stroke-width="2"/><text x="864.0" y="411.0" font-size="18" font-weight="bold" fill="#6B46C1" text-anchor="middle">retrain_with_transcripts.py</text><text x="864.0" y="437.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">leave-one-family-out: train on old CSV + 5</text><text x="864.0" y="459.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">families (each new line weighted × 8), test on</text><text x="864.0" y="481.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">the 6th</text><text x="864.0" y="503.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">threshold picked on a validation slice of the</text><text x="864.0" y="525.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">training families</text><rect x="1098" y="380" width="476" height="170" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="1336.0" y="433.0" font-size="18" font-weight="bold" fill="#C53030" text-anchor="middle">Result (ml/retrain_report.json)</text><text x="1336.0" y="459.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">macro-F1 0.237 → 0.437 overall</text><text x="1336.0" y="481.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">but FY2027 (the one real business meeting) 0.417 →</text><text x="1336.0" y="503.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">0.381, recall 0.77 → 0.31</text><path d="M326,465.0 L350,465.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M630,465.0 L654,465.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M1074,465.0 L1098,465.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><polygon points="560,615.0 790.0,700 560,785.0 330.0,700" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="560" y="683.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">Better on every family that</text><text x="560" y="704.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">matters? (decide by hand — see</text><text x="560" y="725.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">warning)</text><path d="M1336.0,550 L1336.0,700 L790,700" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="26" y="625" width="250" height="120" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="151.0" y="653.0" font-size="18" font-weight="bold" fill="#276749" text-anchor="middle">yes</text><text x="151.0" y="679.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">snapshot first, then copy</text><text x="151.0" y="701.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">the candidate over</text><text x="151.0" y="723.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">action_detector.keras</text><rect x="1000" y="760" width="574" height="98" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2"/><text x="1287.0" y="788.0" font-size="18" font-weight="bold" fill="#A0AEC0" text-anchor="middle">no (today&#x27;s decision)</text><text x="1287.0" y="814.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">keep action_detector.keras; candidate stays in</text><text x="1287.0" y="836.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">ml/action_detector_candidate.keras</text><path d="M330,700 L276,685.0" fill="none" stroke="#2F855A" stroke-width="2.2" marker-end="url(#ahg)"/><path d="M560,785 L560,840 L990,840 L990,809.0 L1000,809.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="26" y="800" width="500" height="95" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="276.0" y="827.0" font-size="17" font-weight="bold" fill="#C53030" text-anchor="middle">⚠ The script overwrites the live model by itself</text><text x="276.0" y="852.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="middle">whenever macro-F1 improves. Snapshot</text><text x="276.0" y="873.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="middle">ml/action_detector.keras before running it.</text></svg>