<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C53030"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker></defs><rect width="1600" height="900" fill="#FFFFFF"/><rect x="10" y="10" width="610" height="880" rx="14" fill="#E9F7EF" fill-opacity="0.55" stroke="#2F855A" stroke-width="2" stroke-dasharray="9 6"/><text x="24" y="35" font-size="19" font-weight="bold" fill="#2F855A" text-anchor="start">Startup — python app.py</text><rect x="30" y="60" width="570" height="120" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="315.0" y="88.0" font-size="18" font-weight="bold" fill="#2C7A7B" text-anchor="middle">Imports</text><text x="315.0" y="114.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">transcript_parser and google_sheets are optional: if their</text><text x="315.0" y="136.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">libraries are missing the module becomes None and the feature</text><text x="315.0" y="158.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">reports &#x27;not installed&#x27;</text><rect x="30" y="210" width="570" height="120" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="315.0" y="238.0" font-size="18" font-weight="bold" fill="#2F855A" text-anchor="middle">Module level</text><text x="315.0" y="264.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">APP_VERSION = &#x27;0.7.3&#x27;</text><text x="315.0" y="286.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Flask(static_folder=&#x27;static&#x27;, static_url_path=&#x27;&#x27;)</text><text x="315.0" y="308.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">app.secret_key (hard-coded)</text><path d="M315.0,180 L315.0,210" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="30" y="360" width="570" height="120" rx="10" fill="#F3EEFC" stroke="#6B46C1" stroke-width="2"/><text x="315.0" y="388.0" font-size="18" font-weight="bold" fill="#6B46C1" text-anchor="middle">ai_extraction.init_app()</text><text x="315.0" y="414.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">unless AI_EXTRACTION_ENABLED=0 — adds /ai-extraction + /api/ai-</text><text x="315.0" y="436.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">extraction/*</text><text x="315.0" y="458.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">and creates its 3 tables</text><path d="M315.0,330 L315.0,360" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="30" y="510" width="570" height="98" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="315.0" y="538.0" font-size="18" font-weight="bold" fill="#4A5568" text-anchor="middle">__main__</text><text x="315.0" y="564.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">init_db() if the .db file is missing</text><text x="315.0" y="586.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">migrate_db(): re-run schema.sql + ALTER TABLE for new columns</text><path d="M315.0,480 L315.0,510" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="30" y="638" width="570" height="98" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="315.0" y="666.0" font-size="18" font-weight="bold" fill="#2F855A" text-anchor="middle">Reloader child (WERKZEUG_RUN_MAIN=true)</text><text x="315.0" y="692.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">start_nudge_scheduler()</text><text x="315.0" y="714.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">app.run(debug=True, port=5000)</text><path d="M315.0,608 L315.0,638" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="30" y="776" width="570" height="98" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="315.0" y="804.0" font-size="18" font-weight="bold" fill="#B7791F" text-anchor="middle">First extraction is slow (20–60 s)</text><text x="315.0" y="830.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">spaCy, MiniLM and Keras load lazily into module globals on first</text><text x="315.0" y="852.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">use, then stay cached</text><rect x="650" y="10" width="940" height="880" rx="14" fill="#E8F1FB" fill-opacity="0.55" stroke="#2B6CB0" stroke-width="2" stroke-dasharray="9 6"/><text x="664" y="35" font-size="19" font-weight="bold" fill="#2B6CB0" text-anchor="start">Every API request</text><rect x="680" y="60" width="880" height="76" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/><text x="694" y="88.0" font-size="18" font-weight="bold" fill="#2B6CB0" text-anchor="start">Page JS → api(path, {method, body})</text><text x="694" y="114.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">fetch() with JSON; on a non-2xx status throws Error(data.error) → toast()</text><rect x="680" y="154" width="880" height="76" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="694" y="182.0" font-size="18" font-weight="bold" fill="#2F855A" text-anchor="start">Flask route function</text><text x="694" y="208.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">matched by URL + method (54 route functions)</text><path d="M820.0,136 L820.0,154" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="680" y="248" width="880" height="76" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="694" y="276.0" font-size="18" font-weight="bold" fill="#2F855A" text-anchor="start">require_email()</text><text x="694" y="302.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">reads session[&#x27;email&#x27;]; None → 401 &#x27;not identified&#x27;</text><path d="M820.0,230 L820.0,248" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="680" y="342" width="880" height="76" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="694" y="370.0" font-size="18" font-weight="bold" fill="#2F855A" text-anchor="start">Validate input</text><text x="694" y="396.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">request.get_json(force=True); missing / invalid fields → 400</text><path d="M820.0,324 L820.0,342" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="680" y="436" width="880" height="76" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="694" y="464.0" font-size="18" font-weight="bold" fill="#4A5568" text-anchor="start">get_db()</text><text x="694" y="490.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">sqlite3.connect(timeout=30) · row_factory = Row · PRAGMA foreign_keys = ON</text><path d="M820.0,418 L820.0,436" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="680" y="530" width="880" height="76" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="694" y="558.0" font-size="18" font-weight="bold" fill="#4A5568" text-anchor="start">Ownership-scoped SQL</text><text x="694" y="584.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">always &#x27;?&#x27; parameters; WHERE … owner_email = ? (get_commitment_or_404 → 404)</text><path d="M820.0,512 L820.0,530" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="680" y="624" width="880" height="76" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="694" y="652.0" font-size="18" font-weight="bold" fill="#4A5568" text-anchor="start">commit() · close()</text><text x="694" y="678.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">one connection per request — nothing is pooled</text><path d="M820.0,606 L820.0,624" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="680" y="718" width="880" height="76" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="694" y="746.0" font-size="18" font-weight="bold" fill="#2C7A7B" text-anchor="start">Side effects after the commit</text><text x="694" y="772.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">auto_sync_to_sheet / auto_push_status_to_sheet — errors are returned, not raised</text><path d="M820.0,700 L820.0,718" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="680" y="812" width="880" height="76" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/><text x="694" y="840.0" font-size="18" font-weight="bold" fill="#2B6CB0" text-anchor="start">jsonify(result), status code</text><text x="694" y="866.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">201 created · 200 ok · 4xx with {&#x27;error&#x27;: …}</text><path d="M820.0,794 L820.0,812" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/></svg>