<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C53030"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker></defs><rect width="1600" height="980" fill="#FFFFFF"/><rect x="14" y="10" width="330" height="46" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="36.5" font-size="19" font-weight="bold" fill="#C53030" text-anchor="middle">Symptom</text><rect x="364" y="10" width="560" height="46" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="36.5" font-size="19" font-weight="bold" fill="#B7791F" text-anchor="middle">Look here first</text><rect x="944" y="10" width="642" height="46" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="36.5" font-size="19" font-weight="bold" fill="#276749" text-anchor="middle">Usual cause → fix</text><rect x="14" y="70" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="111.0" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">Page shows old behaviour / port</text><text x="179.0" y="134.0" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">5000 busy</text><rect x="364" y="70" width="560" height="100" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="122.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">netstat -ano | findstr :5000 — more than one python PID?</text><rect x="944" y="70" width="642" height="100" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="111.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Stale Flask from an earlier run. Stop every python.exe on :5000, start</text><text x="1265.0" y="133.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">once.</text><path d="M344,120.0 L364,120.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M924,120.0 L944,120.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="183" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="235.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">Upload gives 0 commitments</text><rect x="364" y="183" width="560" height="100" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="224.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">extraction_error in the upload response; run the parser trace</text><text x="644.0" y="246.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">(section 11.3)</text><rect x="944" y="183" width="642" height="100" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="224.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Model file / libraries missing, transcript format not recognised (all</text><text x="1265.0" y="246.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">UNKNOWN), or nothing ≥ 0.90.</text><path d="M344,233.0 L364,233.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M924,233.0 L944,233.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="296" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="348.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">&#x27;database is locked&#x27;</text><rect x="364" y="296" width="560" height="100" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="348.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Is DB Browser / a 2nd app.py / a test holding the file?</text><rect x="944" y="296" width="642" height="100" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="348.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Close it. Long ML runs inside the upload transaction — wait or retry.</text><path d="M344,346.0 L364,346.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M924,346.0 L944,346.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="409" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="461.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">Rows not appearing in the Sheet</text><rect x="364" y="409" width="560" height="100" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="461.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">tracker_sync_log.detail · Settings → auto_sync on?</text><rect x="944" y="409" width="642" height="100" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="450.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">GoogleAuthNotReadyError / invalid_grant → rerun google_oauth_setup.py</text><text x="1265.0" y="472.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">(test-mode tokens expire in 7 days).</text><path d="M344,459.0 L364,459.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M924,459.0 L944,459.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="522" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="574.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">Sheet edit doesn&#x27;t reach the app</text><rect x="364" y="522" width="560" height="100" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="574.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Apps Script → Executions log; HTTP code returned</text><rect x="944" y="522" width="642" height="100" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="563.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">ngrok URL changed (update the script), simple onEdit instead of an</text><text x="1265.0" y="585.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">installable trigger, or 404 = wrong email/row.</text><path d="M344,572.0 L364,572.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M924,572.0 L944,572.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="635" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="687.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">Reminder not received</text><rect x="364" y="635" width="560" height="100" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="687.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">nudge_log.status / detail · channel &#x27;Test&#x27; button</text><rect x="944" y="635" width="642" height="100" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="676.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Gmail needs an app password; Slack bot needs users:read.email; task has</text><text x="1265.0" y="698.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">no due date or no owner_email.</text><path d="M344,685.0 L364,685.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M924,685.0 L944,685.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="748" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="800.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">Fathom meeting missing</text><rect x="364" y="748" width="560" height="100" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="800.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">transcript_sync_log; ngrok inspector http://127.0.0.1:4040</text><rect x="944" y="748" width="642" height="100" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="789.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">401 = wrong whsec secret; &#x27;0 turns&#x27; = payload shape changed</text><text x="1265.0" y="811.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">(_fathom_speaker_turns).</text><path d="M344,798.0 L364,798.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M924,798.0 L944,798.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="861" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="913.5" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="middle">AI engine not used</text><rect x="364" y="861" width="560" height="100" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="644.0" y="913.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">ai_extraction_runs: status fell_back + detail</text><rect x="944" y="861" width="642" height="100" rx="10" fill="#EAF7EE" stroke="#276749" stroke-width="2"/><text x="1265.0" y="902.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Consent not given, bad key / base URL, or reply cut off (too long) →</text><text x="1265.0" y="924.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">built-in model took over.</text><path d="M344,911.0 L364,911.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M924,911.0 L944,911.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/></svg>