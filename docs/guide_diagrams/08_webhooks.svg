eight="normal" fill="#1A202C" text-anchor="middle">the only secret — anyone who has the URL can post meetings.</text><text x="794.0" y="787.5" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="middle">&#x27;Regenerate&#x27; rotates it.</text><rect x="1074" y="710" width="500" height="110" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="1324.0" y="756.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="middle">✖ No secret at all: identified by email + &#x27;row-n&#x27;. OK on a</text><text x="1324.0" y="777.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="middle">laptop, not on a public URL.</text></svg>