<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C53030"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker></defs><rect width="1600" height="840" fill="#FFFFFF"/><rect x="14" y="20" width="330" height="100" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="179.0" y="50.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">python app.py</text><text x="179.0" y="76.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">the debug reloader runs a second</text><text x="179.0" y="98.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">copy with WERKZEUG_RUN_MAIN=true</text><rect x="14" y="170" width="330" height="144" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="179.0" y="200.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">start_nudge_scheduler()</text><text x="179.0" y="226.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">daemon thread &#x27;nudge-scheduler&#x27;</text><text x="179.0" y="248.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">interval =</text><text x="179.0" y="270.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">NUDGE_CHECK_INTERVAL_SECONDS</text><text x="179.0" y="292.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">(default 900 s = 15 min)</text><rect x="14" y="340" width="330" height="122" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="179.0" y="370.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">nudge_scheduler_loop</text><text x="179.0" y="396.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">sleep(interval)</text><text x="179.0" y="418.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">accounts = nudge_preferences WHERE</text><text x="179.0" y="440.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">auto_enabled = 1</text><rect x="14" y="510" width="330" height="100" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="179.0" y="540.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">run_nudges(account)</text><text x="179.0" y="566.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">also called by the &#x27;Run nudges now&#x27;</text><text x="179.0" y="588.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">button</text><path d="M179.0,120 L179.0,170" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M179.0,314 L179.0,340" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M179.0,462 L179.0,510" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="104.16" y="475.0" width="149.68" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="179" y="494.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">for each account</text><path d="M14,560.0 L4,560.0 L4,401.0 L14,401.0" fill="none" stroke="#2F855A" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#ahg)"/><rect x="14" y="660" width="330" height="100" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="179.0" y="690.0" font-size="20" font-weight="bold" fill="#C53030" text-anchor="middle">Any exception in a pass</text><text x="179.0" y="716.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">printed as &#x27;[nudges] scheduler pass</text><text x="179.0" y="738.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">failed: …&#x27; and the loop keeps going</text><rect x="400" y="20" width="400" height="122" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="600.0" y="50.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">due_nudges(db, account)</text><text x="600.0" y="76.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">settings = enabled nudge_settings rows</text><text x="600.0" y="98.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">tasks = open tasks (status ≠ done) that have</text><text x="600.0" y="120.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">a due_date</text><path d="M344,560.0 L370,560.0 L370,81.0 L400,81.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><polygon points="600,200.0 800.0,300 600,400.0 400.0,300" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="600" y="264.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Cadence rule matches?</text><text x="600" y="284.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">day_before: due = tomorrow ·</text><text x="600" y="304.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">on_due: due = today ·</text><text x="600" y="324.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">daily_after_overdue: due &lt;</text><text x="600" y="344.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">today</text><path d="M600.0,142 L600,200" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="491.24" y="167.0" width="217.52" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="600" y="186.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">each channel × each task</text><polygon points="600,460.0 800.0,560 600,660.0 400.0,560" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="600" y="544.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Tried in the last 20 h — or a</text><text x="600" y="564.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">one-off reminder already</text><text x="600" y="584.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">sent?</text><path d="M600,400 L600,460" fill="none" stroke="#2F855A" stroke-width="2.2" marker-end="url(#ahg)"/><rect x="606.28" y="417.0" width="39.44" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="626" y="436.0" font-size="16" font-weight="normal" fill="#2F855A" text-anchor="middle">yes</text><rect x="860" y="420" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2"/><text x="960.0" y="452.0" font-size="20" font-weight="bold" fill="#A0AEC0" text-anchor="middle">skip</text><path d="M800,300 L960,300 L960.0,420" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="864.52" y="287.0" width="30.96" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="880" y="306.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">no</text><path d="M800,560 L960,560 L960.0,476" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="860.28" y="547.0" width="39.44" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="880" y="566.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">yes</text><rect x="470" y="720" width="260" height="78" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="600.0" y="750.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">add to plan</text><text x="600.0" y="776.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">(setting, task, reason)</text><path d="M600,660 L600.0,720" fill="none" stroke="#2F855A" stroke-width="2.2" marker-end="url(#ahg)"/><rect x="610.52" y="677.0" width="30.96" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="626" y="696.0" font-size="16" font-weight="normal" fill="#2F855A" text-anchor="middle">no</text><rect x="1100" y="20" width="486" height="78" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="1343.0" y="50.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="middle">send_and_log(setting, task, reason)</text><text x="1343.0" y="76.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">config = json.loads(config_json)</text><path d="M730,759.0 L1060,759.0 L1060,59.0 L1100,59.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="963.96" y="127.0" width="192.08" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="1060" y="146.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">for each planned item</text><rect x="1100" y="160" width="486" height="100" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="1343.0" y="190.0" font-size="20" font-weight="bold" fill="#2C7A7B" text-anchor="middle">notifications.deliver(channel, …)</text><text x="1343.0" y="216.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">compose() subject + body, then one sender — never</text><text x="1343.0" y="238.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">raises, returns (status, detail)</text><path d="M1343.0,98 L1343.0,160" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1150" y="320" width="436" height="76" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="1368.0" y="348.0" font-size="18" font-weight="bold" fill="#C05621" text-anchor="middle">email</text><text x="1368.0" y="374.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">SMTP · STARTTLS 587 or SSL 465 · to owner_email</text><path d="M1120,260.0 L1120,358.0 L1150,358.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1150" y="406" width="436" height="76" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="1368.0" y="434.0" font-size="18" font-weight="bold" fill="#C05621" text-anchor="middle">slack</text><text x="1368.0" y="460.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">xoxb token → DM by email, or incoming webhook</text><path d="M1120,260.0 L1120,444.0 L1150,444.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1150" y="492" width="436" height="76" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="1368.0" y="520.0" font-size="18" font-weight="bold" fill="#C05621" text-anchor="middle">teams</text><text x="1368.0" y="546.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">Workflows URL · Adaptive Card</text><path d="M1120,260.0 L1120,530.0 L1150,530.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1150" y="578" width="436" height="76" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="1368.0" y="606.0" font-size="18" font-weight="bold" fill="#C05621" text-anchor="middle">custom</text><text x="1368.0" y="632.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">POST JSON to any URL</text><path d="M1120,260.0 L1120,616.0 L1150,616.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1100" y="684" width="486" height="100" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="1343.0" y="714.0" font-size="20" font-weight="bold" fill="#4A5568" text-anchor="middle">INSERT nudge_log</text><text x="1343.0" y="740.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">status sent | failed | skipped, reason, detail — read</text><text x="1343.0" y="762.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">it first when a reminder &#x27;didn&#x27;t arrive&#x27;</text><path d="M1100,210.0 L1080,210.0 L1080,734.0 L1100,734.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="1005.16" y="511.0" width="149.68" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="1080" y="530.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">(status, detail)</text></svg>