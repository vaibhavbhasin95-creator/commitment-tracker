<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C53030"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker></defs><rect width="1600" height="960" fill="#FFFFFF"/><rect x="10" y="10" width="880" height="640" rx="14" fill="#EAF7EE" fill-opacity="0.55" stroke="#276749" stroke-width="2" stroke-dasharray="9 6"/><text x="24" y="35" font-size="19" font-weight="bold" fill="#276749" text-anchor="start">Your PC — trusted zone</text><rect x="30" y="60" width="420" height="210" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="44" y="90.0" font-size="20" font-weight="bold" fill="#4A5568" text-anchor="start">Project folder (files)</text><text x="44" y="116.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">client_secret_*.json — OAuth client id/secret</text><text x="44" y="138.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">google_token.json — refresh token: full Sheets</text><text x="44" y="160.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">access</text><text x="44" y="182.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">commitment_tracker.db — plain-text secrets:</text><text x="44" y="204.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">  SMTP password · Slack token · webhook URLs</text><text x="44" y="226.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">  AI API keys · Fathom whsec · webhook tokens</text><text x="44" y="248.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">app.py: secret_key hard-coded (signs cookies)</text><rect x="30" y="370" width="420" height="122" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="44" y="400.0" font-size="20" font-weight="bold" fill="#4A5568" text-anchor="start">Environment variables</text><text x="44" y="426.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">ANTHROPIC_API_KEY — setup-steps helper only</text><text x="44" y="448.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">ANTHROPIC_MODEL · AI_EXTRACTION_ENABLED</text><text x="44" y="470.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">NUDGE_CHECK_INTERVAL_SECONDS</text><rect x="490" y="60" width="380" height="188" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="504" y="90.0" font-size="20" font-weight="bold" fill="#2F855A" text-anchor="start">Flask process — localhost:5000</text><text x="504" y="116.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">debug=True → Werkzeug debugger</text><text x="504" y="138.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">no login: an email is enough</text><text x="504" y="160.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">parameterised SQL · ownership checks</text><text x="504" y="182.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">secrets masked for nudges + AI</text><text x="504" y="204.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">secrets NOT masked for tracker +</text><text x="504" y="226.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">transcript settings</text><path d="M450,125.0 L490,125.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="441.8" y="117.0" width="56.400000000000006" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="470" y="136.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">reads</text><path d="M450,431.0 L680,431.0 L680.0,248" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="550.6" y="418.0" width="98.80000000000001" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="600" y="437.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">os.environ</text><rect x="920" y="10" width="670" height="300" rx="14" fill="#E8F1FB" fill-opacity="0.55" stroke="#2B6CB0" stroke-width="2" stroke-dasharray="9 6"/><text x="934" y="35" font-size="19" font-weight="bold" fill="#2B6CB0" text-anchor="start">Browser</text><rect x="940" y="60" width="630" height="122" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/><text x="954" y="90.0" font-size="20" font-weight="bold" fill="#2B6CB0" text-anchor="start">Session cookie</text><text x="954" y="116.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">{&#x27;email&#x27;: …} signed with HMAC (itsdangerous) — tamper-proof but</text><text x="954" y="138.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">readable, not encrypted.</text><text x="954" y="160.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">Pages escape server text with escapeHtml() (XSS).</text><path d="M940,121.0 L870,121.0" fill="none" stroke="#2B6CB0" stroke-width="2.2" marker-start="url(#ahb)" marker-end="url(#ahb)"/><rect x="1078.4" y="237.0" width="353.20000000000005" height="46" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="1255" y="256.0" font-size="16" font-weight="normal" fill="#2B6CB0" text-anchor="middle">Browser ↔ Flask: plain HTTP on localhost</text><text x="1255" y="276.0" font-size="16" font-weight="normal" fill="#2B6CB0" text-anchor="middle">(no TLS needed while it stays local)</text><rect x="920" y="330" width="670" height="320" rx="14" fill="#FDECEC" fill-opacity="0.55" stroke="#C53030" stroke-width="2" stroke-dasharray="9 6"/><text x="934" y="355" font-size="19" font-weight="bold" fill="#C53030" text-anchor="start">Public internet (only while ngrok runs)</text><rect x="940" y="380" width="630" height="144" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="954" y="410.0" font-size="20" font-weight="bold" fill="#C53030" text-anchor="start">https://&lt;random&gt;.ngrok-free.app → ALL routes</text><text x="954" y="436.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">✔ TLS between caller and ngrok</text><text x="954" y="458.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">✖ the whole app is reachable, not only webhooks</text><text x="954" y="480.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">✖ the Werkzeug debugger is reachable (debug=True)</text><text x="954" y="502.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">✔ Fathom: HMAC-SHA256 checked  ·  ✖ tracker webhook: no secret</text><path d="M940,452.0 L870,452.0" fill="none" stroke="#C53030" stroke-width="2.2" marker-start="url(#ahr)" marker-end="url(#ahr)"/><rect x="862.56" y="415.0" width="64.88" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="895" y="434.0" font-size="16" font-weight="normal" fill="#C53030" text-anchor="middle">tunnel</text><rect x="10" y="680" width="1580" height="270" rx="14" fill="#FEF3E6" fill-opacity="0.55" stroke="#C05621" stroke-width="2" stroke-dasharray="9 6"/><text x="24" y="705" font-size="19" font-weight="bold" fill="#C05621" text-anchor="start">External services (all calls leave over TLS)</text><rect x="30" y="740" width="370" height="110" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="215.0" y="786.0" font-size="20" font-weight="bold" fill="#C05621" text-anchor="middle">Google Sheets API</text><text x="215.0" y="812.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">OAuth bearer token (auto-refreshed)</text><rect x="420" y="740" width="370" height="110" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="605.0" y="775.0" font-size="20" font-weight="bold" fill="#C05621" text-anchor="middle">Anthropic / OpenAI-compatible</text><text x="605.0" y="801.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">API key in a header; transcript text is</text><text x="605.0" y="823.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">sent out</text><rect x="810" y="740" width="370" height="110" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="995.0" y="775.0" font-size="20" font-weight="bold" fill="#C05621" text-anchor="middle">SMTP · Slack · Teams</text><text x="995.0" y="801.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">STARTTLS/SSL with certificate checks;</text><text x="995.0" y="823.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">HTTPS</text><rect x="1200" y="740" width="370" height="110" rx="10" fill="#FEF3E6" stroke="#C05621" stroke-width="2"/><text x="1385.0" y="786.0" font-size="20" font-weight="bold" fill="#C05621" text-anchor="middle">Fathom · Apps Script</text><text x="1385.0" y="812.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">call us via ngrok</text><path d="M660,650 L660,735" fill="none" stroke="#C05621" stroke-width="2.2" marker-end="url(#aho)"/><rect x="597.88" y="679.0" width="124.24000000000001" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="660" y="698.0" font-size="16" font-weight="normal" fill="#C05621" text-anchor="middle">outbound: TLS</text><path d="M1360,735 L1360,655" fill="none" stroke="#C53030" stroke-width="2.2" marker-end="url(#ahr)"/><rect x="1285.16" y="679.0" width="149.68" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="1360" y="698.0" font-size="16" font-weight="normal" fill="#C53030" text-anchor="middle">inbound webhooks</text><rect x="30" y="870" width="1540" height="48" rx="10" fill="#FFFBEA" stroke="#B7791F" stroke-width="2"/><text x="800.0" y="896.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">✔ = control in place   ✖ = known gap (see section 8 and the backlog). Nothing is encrypted at rest: the PC&#x27;s disk encryption and user account are the protection.</text></svg>