start">Red 🔑 columns hold secrets in plain text (no encryption at rest). The whole file is gitignored (*.db) — protect the PC and any backup of it.</text><text x="28" y="825.0" font-size="17" font-weight="normal" fill="#1A202C" text-anchor="start">meeting_id in the ai_extraction tables is not a declared FK, so deleting a meeting would leave those rows behind.</text></svg>