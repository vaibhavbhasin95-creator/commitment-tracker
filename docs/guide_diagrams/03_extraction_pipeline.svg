<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05621"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C53030"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F855A"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B46C1"/></marker></defs><rect width="1600" height="850" fill="#FFFFFF"/><rect x="14" y="14" width="240" height="230" rx="10" fill="#E8F1FB" stroke="#2B6CB0" stroke-width="2"/><text x="134.0" y="97.5" font-size="19" font-weight="bold" fill="#2B6CB0" text-anchor="middle">① Raw transcript</text><text x="134.0" y="123.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">upload .txt, capture</text><text x="134.0" y="145.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">webhook text, or Fathom</text><text x="134.0" y="167.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">turns</text><rect x="278" y="14" width="240" height="230" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="398.0" y="97.5" font-size="19" font-weight="bold" fill="#2C7A7B" text-anchor="middle">② normalize_text</text><text x="398.0" y="123.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">curly quotes ’ “ ” → &#x27; &quot;</text><text x="398.0" y="145.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">non-breaking space →</text><text x="398.0" y="167.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">space</text><rect x="542" y="14" width="240" height="230" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="662.0" y="75.5" font-size="19" font-weight="bold" fill="#2C7A7B" text-anchor="middle">③ to_turns</text><text x="662.0" y="101.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">each line: timestamp</text><text x="662.0" y="123.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">header, inline &#x27;Name:</text><text x="662.0" y="145.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">text&#x27;, scaffolding,</text><text x="662.0" y="167.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">heading, or continuation</text><text x="662.0" y="189.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">→ (speaker, text) turns</text><rect x="806" y="14" width="240" height="230" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="926.0" y="86.5" font-size="19" font-weight="bold" fill="#2C7A7B" text-anchor="middle">④ to_utterances</text><text x="926.0" y="112.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">spaCy sentence split</text><text x="926.0" y="134.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">&gt; 40 words: split before</text><text x="926.0" y="156.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">so / but / and then …</text><text x="926.0" y="178.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">drop pieces &lt; 4 words</text><rect x="1070" y="14" width="240" height="230" rx="10" fill="#F3EEFC" stroke="#6B46C1" stroke-width="2"/><text x="1190.0" y="75.5" font-size="19" font-weight="bold" fill="#6B46C1" text-anchor="middle">⑤ Embed</text><text x="1190.0" y="101.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">&#x27;speaker: text&#x27;</text><text x="1190.0" y="123.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">MiniLM-L6-v2 → 384</text><text x="1190.0" y="145.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">numbers</text><text x="1190.0" y="167.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">batch 128, length-</text><text x="1190.0" y="189.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">normalised</text><rect x="1334" y="14" width="240" height="230" rx="10" fill="#F3EEFC" stroke="#6B46C1" stroke-width="2"/><text x="1454.0" y="97.5" font-size="19" font-weight="bold" fill="#6B46C1" text-anchor="middle">⑥ Classify</text><text x="1454.0" y="123.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">MLP 384→256→128→1</text><text x="1454.0" y="145.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">sigmoid = P(commitment)</text><text x="1454.0" y="167.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">keep if ≥ 0.90</text><path d="M254,129.0 L278,129.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M518,129.0 L542,129.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M782,129.0 L806,129.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M1046,129.0 L1070,129.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M1310,129.0 L1334,129.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="300" width="292" height="170" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="160.0" y="331.5" font-size="19" font-weight="bold" fill="#2F855A" text-anchor="middle">⑦ owner_of</text><text x="160.0" y="357.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">&#x27;Kevin will…&#x27; → Kevin (if he</text><text x="160.0" y="379.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">spoke)</text><text x="160.0" y="401.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">I&#x27;ll / I will / let me →</text><text x="160.0" y="423.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">speaker</text><text x="160.0" y="445.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">can you / please → UNRESOLVED</text><rect x="330" y="300" width="292" height="170" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="476.0" y="353.5" font-size="19" font-weight="bold" fill="#2F855A" text-anchor="middle">⑧ task_of</text><text x="476.0" y="379.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">drop words up to the first cue</text><text x="476.0" y="401.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">(I&#x27;ll, will, need to, please …)</text><text x="476.0" y="423.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">cut at 120 characters</text><rect x="646" y="300" width="292" height="170" rx="10" fill="#E9F7EF" stroke="#2F855A" stroke-width="2"/><text x="792.0" y="342.5" font-size="19" font-weight="bold" fill="#2F855A" text-anchor="middle">⑨ due_of + resolve_due_date</text><text x="792.0" y="368.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">first &#x27;by / before / on X&#x27; or</text><text x="792.0" y="390.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">today, tomorrow, eod …</text><text x="792.0" y="412.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">weekday or relative → ISO date,</text><text x="792.0" y="434.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">else None</text><rect x="962" y="300" width="292" height="170" rx="10" fill="#E6FFFA" stroke="#2C7A7B" stroke-width="2"/><text x="1108.0" y="353.5" font-size="19" font-weight="bold" fill="#2C7A7B" text-anchor="middle">⑩ match_owner</text><text x="1108.0" y="379.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">email / username → full name →</text><text x="1108.0" y="401.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">first or last name</text><text x="1108.0" y="423.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">auto · ambiguous · none</text><rect x="1278" y="300" width="292" height="170" rx="10" fill="#EEF1F4" stroke="#4A5568" stroke-width="2"/><text x="1424.0" y="342.5" font-size="19" font-weight="bold" fill="#4A5568" text-anchor="middle">⑪ INSERT commitments</text><text x="1424.0" y="368.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">status pending + confidence +</text><text x="1424.0" y="390.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">source_quote</text><text x="1424.0" y="412.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">skip a quote already saved for</text><text x="1424.0" y="434.5" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="middle">the meeting</text><path d="M1454.0,244 L1454.0,272 L160.0,272 L160.0,300" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="699.72" y="259.0" width="200.56" height="26" rx="5" fill="#FFFFFF" fill-opacity="0.94"/><text x="800" y="278.0" font-size="16" font-weight="normal" fill="#4A5568" text-anchor="middle">for each kept sentence</text><path d="M306,385.0 L330,385.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M622,385.0 L646,385.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M938,385.0 L962,385.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><path d="M1254,385.0 L1278,385.0" fill="none" stroke="#4A5568" stroke-width="2.2" marker-end="url(#ah)"/><rect x="14" y="500" width="1572" height="340" rx="14" fill="#FFFBEA" fill-opacity="0.55" stroke="#B7791F" stroke-width="2" stroke-dasharray="9 6"/><text x="28" y="525" font-size="19" font-weight="bold" fill="#B7791F" text-anchor="start">Worked example — real run of the production model on two lines of the FY2027 transcript</text><rect x="30" y="548" width="495" height="221" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2"/><text x="44" y="575.0" font-size="17" font-weight="bold" fill="#1A202C" text-anchor="start">Input (TS_HEADER lines + text)</text><text x="44" y="600.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="start" font-family="Consolas, 'Courier New', monospace">[11:28 AM] Sarah Xian:</text><text x="44" y="621.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="start" font-family="Consolas, 'Courier New', monospace">Understood, Bhuvan. I’ll track everyone’s deliverables</text><text x="44" y="642.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="start" font-family="Consolas, 'Courier New', monospace">from the 26th through the 29th, cross-reference the</text><text x="44" y="663.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="start" font-family="Consolas, 'Courier New', monospace">numbers with HR leadership, and give you the master</text><text x="44" y="684.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="start" font-family="Consolas, 'Courier New', monospace">feedback report on the 30th.</text><text x="44" y="705.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="start" font-family="Consolas, 'Courier New', monospace">[11:29 AM] Bhuvan:</text><text x="44" y="726.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="start" font-family="Consolas, 'Courier New', monospace">Once I receive Sarah’s feedback on the 30th, I will</text><text x="44" y="747.0" font-size="15" font-weight="normal" fill="#1A202C" text-anchor="start" font-family="Consolas, 'Courier New', monospace">immediately issue a Calendar invite by Friday.</text><rect x="545" y="548" width="510" height="229" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2"/><text x="559" y="575.0" font-size="17" font-weight="bold" fill="#1A202C" text-anchor="start">③ → ⑥ what each stage produced</text><text x="559" y="601.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">③ 2 turns: &#x27;Sarah Xian&#x27; and &#x27;Bhuvan&#x27; (curly ’ already</text><text x="559" y="623.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">turned into &#x27;).</text><text x="559" y="645.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">④ spaCy splits Sarah&#x27;s turn in two; &#x27;Understood, Bhuvan.&#x27;</text><text x="559" y="667.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">has 2 words (&lt; 4) so it is dropped. 2 sentences remain.</text><text x="559" y="689.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">⑤ a 2 × 384 matrix (first values −0.062, −0.085, −0.016,</text><text x="559" y="711.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">0.031 …).</text><text x="559" y="733.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">⑥ probabilities 1.0000 and 0.9999, both ≥ 0.90 → both</text><text x="559" y="755.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">kept.</text><rect x="1075" y="548" width="495" height="251" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/><text x="1089" y="575.0" font-size="17" font-weight="bold" fill="#C53030" text-anchor="start">⑦ → ⑨ rules, and what to learn from them</text><text x="1089" y="601.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">#1 owner Sarah Xian (I&#x27;ll → speaker). Task cut at 120</text><text x="1089" y="623.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">chars: &#x27;…and give y&#x27;.</text><text x="1089" y="645.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">#2 owner Bhuvan (I will → speaker). Task &#x27;immediately</text><text x="1089" y="667.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">issue a Calendar invite by Friday&#x27;.</text><text x="1089" y="689.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">Both due dates are None: the first match is &#x27;on the</text><text x="1089" y="711.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">30th&#x27;, and resolve_due_date only knows weekdays and</text><text x="1089" y="733.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">words like tomorrow — so &#x27;by Friday&#x27; is never looked at.</text><text x="1089" y="755.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">→ Known limits: mid-word cut, first due phrase wins,</text><text x="1089" y="777.0" font-size="16" font-weight="normal" fill="#1A202C" text-anchor="start">calendar dates not parsed.</text></svg>