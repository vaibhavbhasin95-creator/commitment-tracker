<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Commitment Tracker</title>
<script>
(function () {
    try {
        var t = localStorage.getItem("ct-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-brand"><span class="logo-dot"></span>Commitment Tracker</div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="sidebar-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
                Dashboard
            </a>
            <a href="/settings" class="sidebar-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                Integrations
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="avatar" id="nav-avatar"></div>
            <div class="sidebar-footer-email" id="nav-email"></div>
            <button class="icon-btn" id="logout-btn" title="Log out" aria-label="Log out">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
        </div>
    </aside>

    <div class="main">
        <div class="topbar">
            <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
        </div>

        <div class="content">

            <div class="card status-summary" id="status-summary">
                <div class="status-stats">
                    <div class="stat-tile">
                        <span class="stat-dot" style="background:var(--chart-pending);"></span>
                        <div>
                            <div class="stat-value" id="stat-pending">0</div>
                            <div class="stat-label">Pending</div>
                        </div>
                    </div>
                    <div class="stat-tile">
                        <span class="stat-dot" style="background:var(--chart-progress);"></span>
                        <div>
                            <div class="stat-value" id="stat-in_progress">0</div>
                            <div class="stat-label">In progress</div>
                        </div>
                    </div>
                    <div class="stat-tile">
                        <span class="stat-dot" style="background:var(--chart-done);"></span>
                        <div>
                            <div class="stat-value" id="stat-done">0</div>
                            <div class="stat-label">Done</div>
                        </div>
                    </div>
                </div>
                <div class="status-bar" id="status-bar" role="img" aria-label="Commitment status breakdown"></div>
            </div>

            <div id="meetings-section">
                <div class="section-title">Meetings</div>
                <div class="meetings-list" id="meetings-list"></div>
            </div>

            <div class="toolbar">
                <div class="filters">
                    <select id="filter-status">
                        <option value="">All statuses</option>
                        <option value="pending">Pending</option>
                        <option value="in_progress">In progress</option>
                        <option value="done">Done</option>
                    </select>
                    <select id="filter-owner">
                        <option value="">All owners</option>
                    </select>
                </div>
                <button class="btn secondary" id="seed-demo-btn">Load demo meeting</button>
            </div>

            <div id="commitments-wrap">
                <div class="table-card" id="table-card" style="display:none;">
                    <table id="commitments-table">
                        <thead>
                            <tr>
                                <th>Task</th>
                                <th>Meeting</th>
                                <th>Owner</th>
                                <th>Due</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="commitments-body"></tbody>
                    </table>
                </div>
                <div class="empty-state" id="empty-state" style="display:none;">
                    <div>No commitments yet.</div>
                    <button class="btn" id="empty-seed-btn">Load a demo meeting to see how it works</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- detail modal -->
<div class="modal-backdrop" id="modal-backdrop">
    <div class="modal">
        <button class="modal-close" id="modal-close">&times;</button>
        <h2 id="modal-task"></h2>
        <div id="modal-meeting-title" style="color:var(--text-muted); font-size:13px;"></div>
        <div class="quote" id="modal-quote"></div>
        <div class="modal-meta">
            <div>
                <div class="label">Owner</div>
                <div id="modal-owner"></div>
            </div>
            <div>
                <div class="label">Due date</div>
                <div id="modal-due"></div>
            </div>
            <div>
                <div class="label">Extraction confidence</div>
                <div id="modal-confidence"></div>
            </div>
            <div>
                <div class="label">Status</div>
                <select id="modal-status">
                    <option value="pending">Pending</option>
                    <option value="in_progress">In progress</option>
                    <option value="done">Done</option>
                </select>
            </div>
        </div>

        <div class="section-title">Nudge history</div>
        <div class="nudge-history" id="modal-nudge-history"></div>

        <div class="modal-actions">
            <button class="btn" id="send-nudge-btn">Send test nudge</button>
            <span style="font-size:12px; color:var(--text-faint);">Mock only — no message actually sent</span>
        </div>

        <div class="section-title" style="margin-top:22px;">Task tracker sync</div>
        <div class="nudge-history" id="modal-tracker-history"></div>

        <div class="modal-actions" id="modal-tracker-actions">
            <button class="btn secondary" id="sync-tracker-btn">Sync to tracker</button>
            <span style="font-size:12px; color:var(--text-faint);" id="modal-tracker-note">Mock only — no request actually sent</span>
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="/app.js"></script>
<script>
let currentCommitmentId = null;
let allCommitments = [];

function renderMeetings(meetings) {
    const list = document.getElementById("meetings-list");
    if (meetings.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted); font-size:14px;">No meetings yet.</div>';
        return;
    }
    list.innerHTML = meetings.map(m => `
        <div class="meeting-chip">
            <strong>${escapeHtml(m.title)}</strong>
            <span class="meeting-date"> · ${formatDate(m.meeting_date)} · ${m.source}</span>
        </div>
    `).join("");
}

function populateOwnerFilter(commitments) {
    const select = document.getElementById("filter-owner");
    const owners = [...new Set(commitments.map(c => c.owner_name))].sort();
    const current = select.value;
    select.innerHTML = '<option value="">All owners</option>' +
        owners.map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join("");
    select.value = current;
}

function renderCommitments(commitments) {
    const tableCard = document.getElementById("table-card");
    const body = document.getElementById("commitments-body");
    const empty = document.getElementById("empty-state");

    if (commitments.length === 0) {
        tableCard.style.display = "none";
        empty.style.display = "block";
        return;
    }
    tableCard.style.display = "block";
    empty.style.display = "none";

    body.innerHTML = commitments.map(c => `
        <tr class="row-clickable" data-id="${c.id}">
            <td>${escapeHtml(c.task_text)}</td>
            <td>${escapeHtml(c.meeting_title)}</td>
            <td>${escapeHtml(c.owner_name)}</td>
            <td>${formatDate(c.due_date)}</td>
            <td>
                <span class="badge status-${c.status}">${STATUS_LABELS[c.status]}</span>
                ${c.is_overdue ? '<span class="badge overdue">Overdue</span>' : ""}
            </td>
        </tr>
    `).join("");

    body.querySelectorAll("tr").forEach(row => {
        row.addEventListener("click", () => openModal(parseInt(row.dataset.id, 10)));
    });
}

function renderStatusSummary(commitments) {
    const counts = { pending: 0, in_progress: 0, done: 0 };
    commitments.forEach(c => { counts[c.status] = (counts[c.status] || 0) + 1; });
    const total = commitments.length;

    document.getElementById("stat-pending").textContent = counts.pending;
    document.getElementById("stat-in_progress").textContent = counts.in_progress;
    document.getElementById("stat-done").textContent = counts.done;

    const bar = document.getElementById("status-bar");
    if (total === 0) {
        bar.innerHTML = '<div class="status-bar-empty" title="No commitments yet"></div>';
        return;
    }
    const segments = [
        { key: "pending", label: "Pending", color: "var(--chart-pending)" },
        { key: "in_progress", label: "In progress", color: "var(--chart-progress)" },
        { key: "done", label: "Done", color: "var(--chart-done)" },
    ];
    bar.innerHTML = segments
        .filter(s => counts[s.key] > 0)
        .map(s => {
            const pct = Math.round((counts[s.key] / total) * 100);
            return `<div class="status-bar-seg" style="flex-basis:${pct}%; background:${s.color};" title="${s.label}: ${counts[s.key]} (${pct}%)"></div>`;
        })
        .join("");
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : str;
    return div.innerHTML;
}

async function loadCommitments() {
    const status = document.getElementById("filter-status").value;
    const owner = document.getElementById("filter-owner").value;
    const params = new URLSearchParams();
    if (status) params.set("status", status);
    if (owner) params.set("owner", owner);
    allCommitments = await api(`/api/commitments?${params.toString()}`);
    renderCommitments(allCommitments);
}

async function loadAll() {
    const meetings = await api("/api/meetings");
    renderMeetings(meetings);
    const unfiltered = await api("/api/commitments");
    populateOwnerFilter(unfiltered);
    renderStatusSummary(unfiltered);
    await loadCommitments();
}

async function openModal(id) {
    const c = await api(`/api/commitments/${id}`);
    currentCommitmentId = id;
    document.getElementById("modal-task").textContent = c.task_text;
    document.getElementById("modal-meeting-title").textContent = c.meeting_title;
    document.getElementById("modal-quote").textContent = `"${c.source_quote}"`;
    document.getElementById("modal-owner").textContent = c.owner_name;
    document.getElementById("modal-due").textContent = formatDate(c.due_date) + (c.is_overdue ? " (overdue)" : "");
    document.getElementById("modal-confidence").textContent = c.confidence_score != null
        ? Math.round(c.confidence_score * 100) + "%"
        : "—";
    document.getElementById("modal-status").value = c.status;

    const historyEl = document.getElementById("modal-nudge-history");
    if (c.nudge_history.length === 0) {
        historyEl.innerHTML = '<div class="nudge-history-empty">No nudges sent yet.</div>';
    } else {
        historyEl.innerHTML = c.nudge_history.map(n => `
            <div class="nudge-history-item">${formatDateTime(n.triggered_at)} — ${n.channel} (mock sent)</div>
        `).join("");
    }

    const trackerHistoryEl = document.getElementById("modal-tracker-history");
    if (c.tracker_history.length === 0) {
        trackerHistoryEl.innerHTML = '<div class="nudge-history-empty">No syncs yet.</div>';
    } else {
        trackerHistoryEl.innerHTML = c.tracker_history.map(t => `
            <div class="nudge-history-item">${formatDateTime(t.triggered_at)} — ${t.detail}</div>
        `).join("");
    }
    const syncBtn = document.getElementById("sync-tracker-btn");
    const trackerNote = document.getElementById("modal-tracker-note");
    syncBtn.disabled = !c.tracker_configured;
    trackerNote.textContent = c.tracker_configured
        ? "Mock only — no request actually sent"
        : "No task tracker connected — set one up in Integrations";

    document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal() {
    document.getElementById("modal-backdrop").classList.remove("open");
    currentCommitmentId = null;
}

async function init() {
    initThemeToggle();
    await requireIdentified();
    await initNav();
    await loadAll();

    document.getElementById("filter-status").addEventListener("change", loadCommitments);
    document.getElementById("filter-owner").addEventListener("change", loadCommitments);

    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
        if (e.target.id === "modal-backdrop") closeModal();
    });

    document.getElementById("modal-status").addEventListener("change", async (e) => {
        await api(`/api/commitments/${currentCommitmentId}`, { method: "PATCH", body: { status: e.target.value } });
        toast("Status updated");
        await loadAll();
    });

    document.getElementById("send-nudge-btn").addEventListener("click", async () => {
        const result = await api(`/api/commitments/${currentCommitmentId}/send-test-nudge`, {
            method: "POST",
            body: { channel: "slack" },
        });
        toast("Test nudge logged (mock — nothing was actually sent)");
        await openModal(currentCommitmentId);
    });

    document.getElementById("sync-tracker-btn").addEventListener("click", async () => {
        try {
            await api(`/api/commitments/${currentCommitmentId}/sync-tracker`, { method: "POST" });
            toast("Tracker sync logged (mock — nothing was actually sent)");
            await openModal(currentCommitmentId);
        } catch (err) {
            toast(err.message);
        }
    });

    async function seedDemo() {
        await api("/api/meetings/seed-demo", { method: "POST" });
        toast("Demo meeting loaded");
        await loadAll();
    }
    document.getElementById("seed-demo-btn").addEventListener("click", seedDemo);
    document.getElementById("empty-seed-btn").addEventListener("click", seedDemo);
}

init();
</script>
</body>
</html>
